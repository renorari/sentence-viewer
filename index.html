<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sentence Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 1rem;
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
        }

        main {
            margin: 2rem;
        }

        #sentence {
            font-size: 2rem;
            line-height: 3;
        }

        #buttons {
            margin-top: 1rem;
        }

        button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            min-height: 2.5rem;
            border: none;
            border-radius: 0.5rem;
            background: #1747E5;
            color: white;
            cursor: pointer;
        }

        input[type="number"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            min-height: 2.5rem;
            border: 1px solid #1747E5;
            border-radius: 0.5rem;
            text-align: center;
        }


        a,
        a:visited,
        a:link,
        a:hover,
        a:active {
            color: #1747E5;
        }

        footer {
            font-size: 0.5rem;
            color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <header>
        <h1>
            Sentence Viewer
        </h1>
    </header>

    <main>
        <div id="sentence"></div>
        <div id="buttons">
            <button id="back">前へ</button>
            <input type="number" id="index" value="1" min="1" max="1000">
            <button id="next">次へ</button>
        </div>
    </main>

    <footer>
        <p>
            このページで使用されている文章は、<a href="./copying" target="_blank">このライセンス</a>に基づいて利用されており、原文は<a
                href="https://ja.osdn.net/projects/galateatalk/" target="_blank">GalateaTalk VoiceMaker</a>から引用されています。
            <br>
            このページの作者は、このページに関する一切の保証を否認し、直接的、間接的、結果的損害やデータや利益の損失に対して一切の責任を負いません。
        </p>
        <p>
            元データの変更点に関する情報は、<a href="./changelog" target="_blank">この変更履歴</a>をご覧ください。
            <br>
            このページのソースコードは、<a href="https://github.com/renorari/sentence-viewer" target="_blank">GitHub</a>で公開されています。
        </p>
    </footer>

    <script>
        fetch("./sentence.txt")
            .then(res => res.text())
            .then(data => {
                const segmenter = typeof Intl !== "undefined" && Intl.Segmenter
                    ? new Intl.Segmenter("ja", {
                        granularity: "grapheme"
                    })
                    : null;

                const isKanji = (ch) => /[\u3400-\u9FFF\uF900-\uFAFF々〆ヵヶ]/u.test(ch);

                const escapeHtml = (str) => str
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll("\"", "&quot;")
                    .replaceAll("'", "&#39;");

                const toHiragana = (str) => str.replace(/[\u30A1-\u30F6]/g, (ch) =>
                    String.fromCharCode(ch.charCodeAt(0) - 0x60)
                );

                const splitGraphemes = (str) => {
                    if (!segmenter) {
                        return Array.from(str);
                    }
                    return Array.from(segmenter.segment(str), ({
                        segment
                    }) => segment);
                };

                const tokenizeByScript = (str) => {
                    const chars = splitGraphemes(str);
                    const tokens = [];

                    for (const ch of chars) {
                        const type = isKanji(ch) ? "kanji" : "other";
                        const last = tokens[tokens.length - 1];

                        if (last && last.type === type) {
                            last.value += ch;
                        } else {
                            tokens.push({
                                type,
                                value: ch
                            });
                        }
                    }

                    return tokens;
                };

                const buildRubyHtml = (text, reading) => {
                    if (!text || !reading || text === reading) {
                        return escapeHtml(text || "");
                    }

                    const tokens = tokenizeByScript(text);
                    const normalizedReading = toHiragana(reading);
                    let readingPos = 0;
                    const parts = [];

                    for (let i = 0; i < tokens.length; i += 1) {
                        const token = tokens[i];

                        if (token.type === "other") {
                            const normalizedToken = toHiragana(token.value);
                            if (normalizedReading.startsWith(normalizedToken, readingPos)) {
                                readingPos += normalizedToken.length;
                            }
                            parts.push(escapeHtml(token.value));
                            continue;
                        }

                        let nextBoundary = normalizedReading.length;
                        for (let j = i + 1; j < tokens.length; j += 1) {
                            if (tokens[j].type !== "other") {
                                continue;
                            }
                            const marker = toHiragana(tokens[j].value);
                            const found = normalizedReading.indexOf(marker, readingPos);
                            if (found !== -1) {
                                nextBoundary = found;
                                break;
                            }
                        }

                        const rubyReading = reading.slice(readingPos, nextBoundary);
                        readingPos = nextBoundary;

                        if (!rubyReading) {
                            parts.push(escapeHtml(token.value));
                        } else {
                            parts.push(
                                `<ruby><rb>${escapeHtml(token.value)}</rb><rt>${escapeHtml(rubyReading)}</rt></ruby>`
                            );
                        }
                    }

                    return parts.join("");
                };

                const sentences = data
                    .split("\n")
                    .map((line) => line.trim())
                    .filter(Boolean)
                    .map((sentence) => {
                        const [title, text, read] = sentence.split(":").map((s) => s.trim());
                        return {
                            title,
                            text,
                            read,
                            rendered: buildRubyHtml(text, read)
                        };
                    });

                let index = parseInt(localStorage.getItem("sentence-viewer-index")) || 0;
                const sentenceElement = document.getElementById("sentence");
                const nextButton = document.getElementById("next");
                const backButton = document.getElementById("back");
                const indexInput = document.getElementById("index");

                indexInput.max = sentences.length;

                const updateSentence = async () => {
                    const {
                        title,
                        rendered
                    } = sentences[index];
                    sentenceElement.innerHTML = rendered;
                    document.title = `Sentence Viewer | ${title}`;
                    document.querySelector("h1").innerText = `Sentence Viewer | ${title}`;
                    indexInput.value = index + 1;

                    localStorage.setItem("sentence-viewer-index", index);
                }

                function next() {
                    index = (index + 1) % sentences.length;
                    updateSentence();
                }

                function back() {
                    index = (index - 1 + sentences.length) % sentences.length;
                    updateSentence();
                }

                document.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowRight") {
                        next();
                    } else if (e.key === "ArrowLeft") {
                        back();
                    } else if (e.key === "ArrowUp") {
                        index = (index + 50) % sentences.length;
                        updateSentence();
                    } else if (e.key === "ArrowDown") {
                        index = (index - 50 + sentences.length) % sentences.length;
                        updateSentence();
                    }
                });

                nextButton.addEventListener("click", () => {
                    next();
                });

                backButton.addEventListener("click", () => {
                    back();
                });

                indexInput.addEventListener("change", () => {
                    index = (parseInt(indexInput.value) - 1 + sentences.length) % sentences.length;
                    updateSentence();
                });

                updateSentence();
            });
    </script>
</body>

</html>
